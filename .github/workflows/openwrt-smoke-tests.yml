name: OpenWrt Smoke Tests

on:
  push:
    branches:
      - main
      - fail-closed
      - 'rc/**'
    paths:
      - 'netshift/**'
      - 'luci-app-netshift/**'
      - 'tests/**'
      - 'install.sh'
      - 'Dockerfile-ipk'
      - 'Dockerfile-apk'
      - '.dockerignore'
      - '.github/workflows/openwrt-smoke-tests.yml'
  pull_request:
    branches:
      - main
      - fail-closed
      - 'rc/**'
    paths:
      - 'netshift/**'
      - 'luci-app-netshift/**'
      - 'tests/**'
      - 'install.sh'
      - 'Dockerfile-ipk'
      - 'Dockerfile-apk'
      - '.dockerignore'
      - '.github/workflows/openwrt-smoke-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    name: OpenWrt rootfs smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_INTERACTIVE_NO_CLI: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Build OpenWrt smoke test image
        run: docker compose -f tests/docker-compose.yml build netshift-test

      - name: Run OpenWrt smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tests/test-results
          for attempt in 1 2 3; do
            echo "Smoke tests attempt ${attempt}/3"
            set +e
            docker compose -f tests/docker-compose.yml run --rm -T netshift-test all 2>&1 | tee "tests/test-results/smoke-attempt-${attempt}.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Smoke tests failed on attempt ${attempt}; retrying in 5 seconds..."
              sleep 5
            fi
          done
          echo "Smoke tests failed after 3 attempts"
          exit 1

      - name: Collect smoke diagnostics on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p tests/test-results
          docker compose -f tests/docker-compose.yml ps -a > tests/test-results/compose-ps.txt || true
          docker compose -f tests/docker-compose.yml logs --no-color > tests/test-results/compose-logs.txt || true

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: smoke-diagnostics-${{ github.sha }}
          path: tests/test-results/*
          retention-days: 7
          if-no-files-found: warn
